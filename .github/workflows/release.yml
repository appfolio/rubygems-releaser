name: Release Gem to RubyGems.org

on:
  workflow_call:
    inputs:
      working_directory:
        description: 'The directory containing the gem (for monorepos with gems in subdirectories). Defaults to repository root.'
        required: false
        type: string
        default: '.'

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release-please.outputs[format('{0}--release_created', inputs.working_directory)] || steps.release-please.outputs.release_created }}
    steps:
      - name: Release Please
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release-please

  publish:
    runs-on: ubuntu-latest
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    permissions:
      id-token: write
      contents: write
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@a4aa98b93cab29d9b1101a6143fb8bce00e2eac4 # v2.7.1
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Exchange OIDC token with JFrog
        uses: jfrog/setup-jfrog-cli@v5
        id: jfrog
        env:
          JF_URL: https://appfolio.jfrog.io
        with:
          oidc-provider-name: appfolio-github-oidc
          oidc-audience: jfrog-appfolio
      - name: Configure Bundler credentials for JFrog
        shell: bash
        run: |
          TOKEN="${{ steps.jfrog.outputs.oidc-token }}"
          if [ -z "$TOKEN" ]; then
            echo "::error::JFrog OIDC token exchange failed"
            exit 1
          fi
          echo "::add-mask::${TOKEN}"
          PAYLOAD=$(echo "$TOKEN" | cut -d. -f2 | tr '_-' '/+' | base64 -d 2>/dev/null || true)
          SUB=$(echo "$PAYLOAD" | jq -r '.sub // empty' 2>/dev/null || true)
          if [ -n "$SUB" ]; then
            ENCODED_SUB=$(printf '%s' "$SUB" | sed 's/\//%2F/g; s/@/%40/g; s/:/%3A/g; s/\[/%5B/g; s/\]/%5D/g')
            echo "BUNDLE_APPFOLIO__JFROG__IO=${ENCODED_SUB}:${TOKEN}" >> $GITHUB_ENV
          fi
      - name: Setup Ruby
        uses: ruby/setup-ruby@0cb964fd540e0a24c900370abf38a33466142735 # v1.305.0
        with:
          working-directory: ${{ inputs.working_directory }}
          bundler-cache: true
          ruby-version: ruby
      - name: Configure RubyGems credentials
        uses: rubygems/configure-rubygems-credentials@bc6dd217f8a4f919d6835fcfefd470ef821f5c44 # v1.0.0
      - name: Build and publish gem
        run: |
          bundle exec rake build
          gem push pkg/*.gem
